# =============================================================================
# k8s/00_namespace.yaml — Namespace sandbox
# =============================================================================
apiVersion: v1
kind: Namespace
metadata:
  name: neuvector-test
  labels:
    purpose: security-testing
    neuvector.com/monitor: "true"

---
# =============================================================================
# k8s/01_target_app.yaml — Aplikacja docelowa (cel ataków)
# Nginx jako prosty target HTTP dla testów WAF, DLP, Network Policy
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: target-app
  namespace: neuvector-test
  labels:
    app: target-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: target-app
  template:
    metadata:
      labels:
        app: target-app
    spec:
      securityContext:
        runAsNonRoot: false   # celowo: testujemy wykrywanie root
      containers:
        - name: nginx
          image: nginx:1.25-alpine
          ports:
            - containerPort: 80
          resources:
            limits:
              cpu: "200m"
              memory: "128Mi"
            requests:
              cpu: "50m"
              memory: "64Mi"

---
apiVersion: v1
kind: Service
metadata:
  name: target-app
  namespace: neuvector-test
spec:
  selector:
    app: target-app
  ports:
    - port: 80
      targetPort: 80

---
# =============================================================================
# k8s/02_rbac.yaml — RBAC dla Job testowego
# Minimalny zestaw uprawnień: odczyt podów/serwisów/sekretów w namespace,
# dostęp do kubectl exec (dla testów runtime)
# =============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nv-tester
  namespace: neuvector-test

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: nv-tester-role
  namespace: neuvector-test
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "secrets", "configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["rolebindings", "clusterrolebindings"]
    verbs: ["get", "list"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: nv-tester-binding
  namespace: neuvector-test
subjects:
  - kind: ServiceAccount
    name: nv-tester
    namespace: neuvector-test
roleRef:
  kind: Role
  name: nv-tester-role
  apiGroup: rbac.authorization.k8s.io

---
# Uprawnienia do odczytu zasobów NeuVector CRD i skanerów w namespace neuvector
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: nv-tester-cluster-reader
rules:
  - apiGroups: ["neuvector.com"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods", "services"]
    verbs: ["get", "list"]
  - apiGroups: ["admissionregistration.k8s.io"]
    resources: ["validatingwebhookconfigurations", "mutatingwebhookconfigurations"]
    verbs: ["get", "list"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: nv-tester-cluster-binding
subjects:
  - kind: ServiceAccount
    name: nv-tester
    namespace: neuvector-test
roleRef:
  kind: ClusterRole
  name: nv-tester-cluster-reader
  apiGroup: rbac.authorization.k8s.io

---
# =============================================================================
# k8s/03_test_job.yaml — Główny Job uruchamiający framework testowy
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: nv-test-scripts
  namespace: neuvector-test
data:
  # Skrypty są wbudowane w obraz Docker (patrz Dockerfile)
  # ConfigMap służy do konfiguracji środowiskowej
  NAMESPACE: "neuvector-test"
  NV_NAMESPACE: "neuvector"
  TARGET_SVC: "target-app"
  TEST_TIMEOUT: "60"

---
apiVersion: batch/v1
kind: Job
metadata:
  name: nv-security-tester
  namespace: neuvector-test
  labels:
    app: nv-security-tester
spec:
  ttlSecondsAfterFinished: 86400   # Pod żyje 24h po zakończeniu (dla kubectl cp)
  backoffLimit: 0                  # Nie ponawiaj przy błędzie
  template:
    metadata:
      labels:
        app: nv-security-tester
    spec:
      serviceAccountName: nv-tester
      restartPolicy: Never
      containers:
        - name: tester
          # Zastąp własną nazwą obrazu po docker build
          image: nv-security-tester:latest
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "/app/run_tests.sh"]
          envFrom:
            - configMapRef:
                name: nv-test-scripts
          env:
            - name: REPORT_DIR
              value: "/report"
          volumeMounts:
            - name: report-vol
              mountPath: /report
          resources:
            limits:
              cpu: "500m"
              memory: "256Mi"
            requests:
              cpu: "100m"
              memory: "128Mi"
      volumes:
        - name: report-vol
          emptyDir: {}
